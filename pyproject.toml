[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiking-route-recommender-demo"
version = "0.1.0"
description = "Synthetic commercial-style recommender-system demo for hiking route catalogs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus_client>=0.20",
    "prometheus_fastapi_instrumentator>=6.0",
    "jinja2>=3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.28",
    "pytest>=8.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hiking_recommender = [
    "templates/*.html",
    "templates/partials/*.html",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
